    const hp = new THREE.Shape(); hp.moveTo(-0.45, 0); hp.lineTo(0.45, 0); hp.lineTo(0.45, -0.45); hp.lineTo(0, -0.9); hp.lineTo(-0.45, -0.45); hp.closePath();
    const hpm = flat(new THREE.ShapeGeometry(hp), M.white, 0.05, 0, 0); hpm.rotation.z = Math.PI; hpm.position.z = -0.2;
    const mound = new THREE.Mesh(new THREE.CylinderGeometry(2.2, 2.7, 0.45, 24), M.dirt); mound.position.set(0, 0.2, -11.5); scene.add(mound);
    const rub = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.08, 0.22), M.white); rub.position.set(0, 0.46, -11.5); scene.add(rub);
    const L = 55.7;
    [1, -1].forEach(sx => {
      const ln = new THREE.Mesh(new THREE.PlaneGeometry(0.22, L), M.white); ln.rotation.x = -Math.PI / 2; ln.rotation.z = sx * Math.PI / 4;
      ln.position.set(sx * L / 2 * Math.SQRT1_2, 0.04, -L / 2 * Math.SQRT1_2); scene.add(ln);

    }
    idleT += dt;
    if (!controls.autoRotate && W.autoWanted && idleT > 6 && !fly) controls.autoRotate = true;
    controls.update();
    nextAction -= dt; if (nextAction < 0) { startAction(t); nextAction = 1.6 + Math.random() * 1.6; }
    W.chars.forEach(c => animateChar(c, t, dt)); W.podiumChars.forEach(c => animateChar(c, t, dt));
    if (ballFlight) {
      const x = (now - ballFlight.t0) / .45;
      if (x >= 1) { ball.visible = false; ballFlight = null; }
      else { ball.visible = true; ball.position.lerpVectors(ballFlight.from, ballFlight.to, x); ball.position.y += Math.sin(x * Math.PI) * .8; }
    }
    // 紙吹雪
    const pos = confGeo.attributes.position.array; const sp = 1 + confBoost;
    for (let i = 0; i < CONF; i++) { pos[i * 3 + 1] -= dt * 1.4 * cv[i] * sp; pos[i * 3] += Math.sin(t * 2 + i) * dt * .4; if (pos[i * 3 + 1] < 0) pos[i * 3 + 1] = 10 + Math.random() * 2; }
    confGeo.attributes.position.needsUpdate = true; confBoost = Math.max(0, confBoost - dt);
    leaderCrown.rotation.y += dt * 1.5;
    if (spot.visible) { spot.material.opacity = .16 + Math.sin(t * 3) * .05; spotRing.scale.setScalar(1 + Math.sin(t * 4) * .1); }
    bigTrophy.rotation.y += dt * .8; trophySlot.children.forEach((c, i) => c.rotation.y = t * .6 + i);
    W.flags.forEach((f, i) => f.rotation.z = Math.sin(t * 3 + i) * .15);
    renderer.render(scene, camera);
  }

  /* ----- タップ判定（ドラッグと区別） ----- */
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  let down = null;
  renderer.domElement.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; idleT = 0; fly = null; });
  controls.addEventListener('start', () => { controls.autoRotate = false; idleT = 0; });
  renderer.domElement.addEventListener('pointerup', e => {
    if (!down) return;
    const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dur = performance.now() - down.t; down = null;
    if (moved > 10 || dur > 600) return;
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(clickables, false)[0];
    if (!hit) return;
    const u = hit.object.userData;
    if (u.type === 'player') { const ch = [...W.chars, ...W.podiumChars].find(c => c.id === u.id); if (ch) ch.act = { type: 'cheer', t0: performance.now() / 1000 }; openView('profile', { id: u.id }, false); }
    else if (u.type === 'score') openView('games', {}, false);
    else if (u.type === 'board') openView('ranking', { key: S.boardCat }, false);
    else if (u.type === 'mvp') { confBoost = 3; openView('mvp', {}, false); }
    else if (u.type === 'trophy') openView('trophy', {}, false);
  });
  $('#tapHint').style.opacity = 1; setTimeout(() => $('#tapHint').style.opacity = 0, 6000);

  addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(raf); else if (active) { last = performance.now() / 1000; cancelAnimationFrame(raf); loop(); } });

  const VIEWPOINTS = {
    home: () => [HOME_VIEW.target.clone(), HOME_VIEW.pos.clone()],
    board: () => { const p = board.g.position; return [new THREE.Vector3(p.x, 6, p.z), new THREE.Vector3(p.x * .45, 14, p.z * .45 + 4)]; },
    score: () => [new THREE.Vector3(0, 9, CZ - 52), new THREE.Vector3(0, 16, CZ - 20)],
    mvp: () => [new THREE.Vector3(PODIUM.x, 3.5, PODIUM.z), new THREE.Vector3(PODIUM.x + 7.3, 9, PODIUM.z + 15.3)],
    trophy: () => [new THREE.Vector3(CASE.x, 2.5, CASE.z), new THREE.Vector3(CASE.x - 7.3, 8, CASE.z + 15.3)],
    bench: () => [new THREE.Vector3(24, 1.5, -4), new THREE.Vector3(8, 10, -18)]
  };
  // 1位交代のランキング板は7秒ごとに種目を切り替え
  let boardTimer = setInterval(() => {
    if (!active || paused) return;
    const keys = C.CATEGORIES.filter(c => c.main).map(c => c.key); S.boardCat = keys[(keys.indexOf(S.boardCat) + 1) % keys.length];
    drawBoard(); placeLeader();
  }, 7000);

  function refresh() { rebuildPlayers(); rebuildPodium(); rebuildTrophies(); drawScoreboard(); drawBoard(); placeLeader(); drawSign(); }
  logoReady.then(() => { drawSign(); drawScoreboard(); });
  refresh();
  if (document.fonts) document.fonts.ready.then(() => { drawScoreboard(); drawBoard(); drawSign(); rebuildPlayers(); rebuildPodium(); placeLeader(); });
  loop();
  W.autoWanted = true;
  $('#rotBtn').onclick = () => { W.autoWanted = !W.autoWanted; controls.autoRotate = W.autoWanted; $('#rotBtn').classList.toggle('on', W.autoWanted); toast(W.autoWanted ? '自動回転オン' : '自動回転オフ'); };
  $('#resetBtn').onclick = () => api.flyTo('home');

  const api = {
    refresh,
    setActive(on) { active = on; cancelAnimationFrame(raf); if (on) { last = performance.now() / 1000; loop(); } },
    setPaused(on) { paused = on; },
    setBoard(k) { S.boardCat = k; drawBoard(); placeLeader(); },
    flyTo(name) {
      const [tt, tp] = VIEWPOINTS[name](); controls.autoRotate = false; idleT = -6;
      fly = { t0: performance.now() / 1000, d: 1.1, ft: controls.target.clone(), fp: camera.position.clone(), tt, tp };
    },
    __debug: { scene, camera, controls, renderer, clickables, chars: () => W.chars }
  };
  return api;
}
const W = { chars: [], podiumChars: [], flags: [], clouds: [], leaderId: null, autoWanted: true, crowd: null };

/* ================= 起動 ================= */
(async function start() {
  await load();
  let mode = '3d';
  try { mode = localStorage.getItem('wr-mode') || '3d'; } catch (e) {}
  await setMode(mode, false);
  // URLの「#player=…」などから直接画面を開く（LINEで特定の選手を共有できる）
  const h = location.hash.slice(1);
  if (h) {
    const [k, v] = h.split('=');
    if (k === 'player' && P(v)) openView('profile', { id: v }, false);
    else if (k === 'game' && C.gameById(D(), v)) openView('game', { id: v }, false);
    else if (k === 'ranking') openView('ranking', { key: C.categoryByKey(v) ? v : 'AVG' }, false);
    else if (VIEWS[k] && !['profile', 'game'].includes(k)) openView(k, {}, false);
  }
loadCards();
const ld = $('#loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 500);
  window.__WR = { S, World: () => World, openView, bgm: () => BGM.state() };
  // オフライン対応（公開サーバー上のみ）
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
