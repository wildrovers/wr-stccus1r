<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12235a">
<meta name="robots" content="noindex,nofollow"><!-- 検索エンジンに載せない（URLを知っている人だけが見る想定） -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ワイロバ">
<meta property="og:title" content="ワイルドローバーズ ボールパーク">
<meta property="og:description" content="ワイルドローバーズの成績・ランキング・試合結果をチェック！">
<meta property="og:image" content="https://wildrovers.github.io/wr-stccus1r/logo-512.png">
<link rel="icon" type="image/png" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ワイロバ ボールパーク</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --navy:#12235a; --navy2:#0a1638; --navy3:#1d3580;
  --yellow:#ffc928; --yellow2:#ffe27a;
  --sky:#bfe6ff; --grass:#5cbf4f;
  --card:#ffffff; --text:#13213f; --muted:#5b6788; --line:#e3e8f3;
  --gold:#f5c542; --silver:#c3cdd8; --bronze:#d9935a;
  --win:#1e9e53; --lose:#d64545; --draw:#8a93a6;
  --header-h:56px; --nav-h:64px;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  --font:'M PLUS Rounded 1c','Hiragino Maru Gothic ProN','Hiragino Sans','Noto Sans JP',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;}
body{font-family:var(--font);font-weight:800;color:var(--text);background:linear-gradient(#9fd8ff,#dff3ff 45%,#8fd17f 45%,#5cbf4f);overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;font-weight:800;cursor:pointer}
select{font-family:inherit;font-weight:800}
.hidden{display:none!important}

/* ---------- ヘッダー ---------- */
#header{position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--header-h) + var(--safe-t));padding:var(--safe-t) 12px 0;
  display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(10,22,56,.96),rgba(18,35,90,.92));color:#fff;border-bottom:3px solid var(--yellow)}
#header .logo{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
#header .logo svg{flex:none}
#header .logo b{font-size:16px;line-height:1.05;white-space:nowrap}
#header .logo small{display:block;font-size:10px;color:var(--yellow);letter-spacing:.12em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#header .logo div{min-width:0}
@media (max-width:440px){ #header .logo div{display:none} } /* 狭い画面ではロゴ画像だけ（チーム名はロゴに入っている） */
.pill-select{appearance:none;-webkit-appearance:none;border:2px solid var(--yellow);background:var(--navy2);color:#fff;border-radius:999px;padding:6px 26px 6px 12px;font-size:14px;
  background-image:linear-gradient(45deg,transparent 50%,var(--yellow) 50%),linear-gradient(135deg,var(--yellow) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.mode-btn{border:none;border-radius:999px;background:var(--yellow);color:var(--navy);padding:8px 12px;font-size:13px;box-shadow:0 3px 0 #c99a10;min-height:36px}
.bgm-btn{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--yellow);background:var(--navy2);color:#fff;font-size:17px;display:grid;place-items:center;padding:0}
#soundMenu{position:fixed;z-index:50;top:calc(var(--header-h) + var(--safe-t) + 6px);right:12px;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:4px;min-width:170px}
#soundMenu button{display:flex;align-items:center;justify-content:space-between;gap:12px;border:none;background:#f4f6fb;border-radius:10px;padding:10px 12px;font-size:15px;color:var(--navy);min-height:44px}
#soundMenu b{font-size:12px;border-radius:999px;padding:2px 10px;background:#dfe4ee;color:#5b6788}
#soundMenu b.on{background:var(--yellow);color:var(--navy)}
.bgm-btn.on{background:var(--yellow);animation:bgmPulse 1s ease-in-out infinite}
@keyframes bgmPulse{50%{transform:scale(1.08)}}
.mode-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c99a10}

/* ---------- バナー ---------- */
#banner{position:fixed;top:calc(var(--header-h) + var(--safe-t) + 6px);left:50%;transform:translateX(-50%);z-index:29;max-width:calc(100% - 24px);
  background:#fff3c4;border:2px solid var(--yellow);color:var(--navy);border-radius:14px;padding:6px 12px;font-size:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.15)}
#banner.test{background:#ffe0e0;border-color:#ff7b7b}

/* ---------- 3D ---------- */
#stage{position:fixed;inset:0;z-index:1;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#hud{position:fixed;z-index:10;right:12px;top:calc(var(--header-h) + var(--safe-t) + 48px);display:flex;flex-direction:column;gap:10px}
.round-btn{width:46px;height:46px;border-radius:50%;border:3px solid #fff;background:var(--navy);color:#fff;font-size:20px;box-shadow:0 4px 0 var(--navy2),0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.round-btn.on{background:var(--yellow);color:var(--navy)}
.round-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy2)}
#spots{position:fixed;z-index:10;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b) + 10px);display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
#spots::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:999px;padding:8px 14px;font-size:13px;box-shadow:0 3px 0 var(--navy);min-height:40px;white-space:nowrap}
.chip.on{background:var(--navy);color:var(--yellow)}
.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
#tapHint{position:fixed;z-index:9;left:50%;transform:translateX(-50%);top:calc(var(--header-h) + var(--safe-t) + 14px);background:rgba(18,35,90,.85);color:#fff;border-radius:999px;padding:6px 14px;font-size:12px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#emptyCard{position:fixed;z-index:11;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 32px));background:#fff;border-radius:20px;border:3px solid var(--navy);padding:18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25)}
#emptyCard p{font-weight:500;font-size:14px;line-height:1.6;margin:8px 0 14px}

/* ---------- 2Dホーム ---------- */
#home2d{position:fixed;inset:0;z-index:2;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--header-h) + var(--safe-t) + 14px) 16px calc(var(--nav-h) + var(--safe-b) + 20px);
  background:linear-gradient(#bfe6ff,#e9f7ff 220px,#f4f8ef)}
.wrap{max-width:760px;margin:0 auto}

/* ---------- シート（詳細画面） ---------- */
#sheet{position:fixed;z-index:20;left:0;right:0;margin:0 auto;max-width:760px;top:calc(var(--header-h) + var(--safe-t) + 8px);bottom:calc(var(--nav-h) + var(--safe-b));
  background:#f4f6fb;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(110%);transition:transform .32s cubic-bezier(.2,.9,.3,1.1);display:flex;flex-direction:column;border:3px solid var(--navy);border-bottom:none}
#sheet.open{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--navy);color:#fff;border-radius:18px 18px 0 0}
.sheet-head h2{flex:1;margin:0;font-size:18px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:20px;flex:none}
.icon-btn.ghost{visibility:hidden}
#sheetBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 28px;overscroll-behavior:contain}

/* ---------- 下部メニュー ---------- */
#nav{position:fixed;z-index:40;left:0;right:0;bottom:0;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:var(--navy);border-top:3px solid var(--yellow);display:flex}
#nav button{flex:1;background:none;border:none;color:#c8d2f0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;padding:4px 0}
#nav button span{font-size:22px;line-height:1;transition:transform .2s}
#nav button.on{color:var(--yellow)}
#nav button.on span{transform:translateY(-2px) scale(1.15)}

/* ---------- 部品 ---------- */
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 3px 0 var(--line),0 6px 14px rgba(18,35,90,.06);border:2px solid var(--line)}
.card h3{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:6px;color:var(--navy)}
.card h3 .sub{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:999px;background:var(--navy);color:#fff;padding:12px 18px;font-size:15px;min-height:46px;box-shadow:0 4px 0 var(--navy2);text-decoration:none}
.btn.y{background:var(--yellow);color:var(--navy);box-shadow:0 4px 0 #c99a10}
.btn.w{background:#fff;color:var(--navy);border:2px solid var(--navy);box-shadow:0 4px 0 var(--navy)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px}
.btn:active{transform:translateY(3px);box-shadow:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.unreg{color:#9aa3b8;font-size:.72em;font-weight:500}
.muted{color:var(--muted);font-weight:500;font-size:12px}
.note{font-size:11px;color:var(--muted);font-weight:500;line-height:1.6;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.stat{background:#f4f6fb;border-radius:12px;padding:8px 6px;text-align:center;border:2px solid #e8ecf6}
.stat .l{font-size:11px;color:var(--muted);font-weight:500}
.stat .v{font-size:20px;line-height:1.3;color:var(--navy);word-break:keep-all}
.stat.hl{background:linear-gradient(#fff6d3,#ffe9a0);border-color:var(--yellow)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin:0 -2px 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{min-height:36px;padding:6px 12px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:12px;background:#eef2fb;color:var(--navy);margin:0 4px 6px 0;border:2px solid #dbe2f3}
.badge.gold{background:linear-gradient(#fff3bf,#ffd659);border-color:#e7b625}
.res{display:inline-grid;place-items:center;min-width:34px;height:26px;border-radius:8px;color:#fff;font-size:13px;padding:0 6px}
.res.勝{background:var(--win)} .res.負{background:var(--lose)} .res.分{background:var(--draw)}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.tscroll{overflow-x:auto;margin:0 -4px}
table.t th{font-size:11px;color:var(--muted);font-weight:500;padding:6px 6px;border-bottom:2px solid var(--line);white-space:nowrap;text-align:center}
table.t td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.t td.l,table.t th.l{text-align:left}
.stat-table .sticky{position:sticky;left:0;background:#fff;z-index:1;box-shadow:2px 0 0 var(--line);max-width:9em;overflow:hidden;text-overflow:ellipsis}
.list-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:#fff;border:2px solid var(--line);margin-bottom:8px;cursor:pointer;min-height:56px}
.list-item:active{transform:scale(.98)}
.list-item .grow{flex:1;min-width:0}
.list-item .nm{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num-tag{display:inline-grid;place-items:center;min-width:28px;height:22px;border-radius:7px;background:var(--navy);color:var(--yellow);font-size:12px;padding:0 5px;margin-right:4px}

/* 選手名鑑 */
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{background:linear-gradient(180deg,#fff 0,#fff 60%,#eef3ff 100%);border-radius:18px;border:3px solid var(--navy);padding:10px 8px 12px;text-align:center;cursor:pointer;position:relative;box-shadow:0 4px 0 var(--navy)}
.pcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.pcard .nm{font-size:15px;margin-top:2px}
.pcard .pos{font-size:11px;color:var(--muted);font-weight:500}
.pcard .wp{z-index:2;position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.pcard .wp b{border-radius:999px;font-size:10.5px;padding:2px 7px;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pcard .wp .mv1{background:var(--yellow);color:var(--navy)}
.pcard .wp .mv2{background:#e3e8ef;color:#3f4a57}
.pcard .wpline{margin-top:4px;font-size:13px;color:var(--navy);background:#fff6d3;border-radius:999px;display:inline-block;padding:1px 10px}
.pcard.inactive{opacity:.55}

/* ランキング */
.rk{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:#fff;border:2px solid var(--line);margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden;min-height:60px}
.rk .no{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eef2fb;color:var(--navy);font-size:16px;flex:none;position:relative}
.rk .val{font-size:22px;color:var(--navy);text-align:right}
.rk .val small{font-size:11px;margin-left:2px}
.rk .chg{font-size:11px;display:block;text-align:right;font-weight:500}
.chg.up{color:var(--win)} .chg.down{color:var(--lose)}
.rk.r1{background:linear-gradient(110deg,#fff8d6,#ffe27a 55%,#ffd23d);border-color:#e7b625;box-shadow:0 0 0 3px rgba(255,201,40,.35),0 6px 18px rgba(231,182,37,.45)}
.rk.r2{background:linear-gradient(110deg,#fbfcfe,#dfe6ee);border-color:var(--silver)}
.rk.r3{background:linear-gradient(110deg,#fff6ef,#f2c7a2);border-color:var(--bronze)}
.rk.r1 .no{background:var(--gold);color:#7a5600}
.rk.r2 .no{background:var(--silver);color:#3f4a57}
.rk.r3 .no{background:var(--bronze);color:#5d3313}
.rk.r1 .no::before{content:'👑';position:absolute;top:-17px;font-size:18px;animation:bob 1.6s ease-in-out infinite}
.rk.r1::after{content:'';position:absolute;inset:-40% auto -40% -30%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
.spot{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 26px 50%,rgba(255,255,255,.9),transparent 60px)}
@keyframes shine{0%{left:-40%}60%,100%{left:130%}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-6deg)}}

/* プロフィール */
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--navy),var(--navy3));color:#fff;border-radius:20px;padding:14px;margin-bottom:12px;border:3px solid var(--yellow);position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,201,40,.15)}
.hero .big-no{font-size:44px;color:var(--yellow);line-height:1}
.hero .nm{font-size:22px;line-height:1.2}
.hero .meta{font-size:12px;color:#c8d2f0;font-weight:500;margin-top:4px}
.rankgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rankgrid div{background:#f4f6fb;border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:500;color:var(--muted)}
.rankgrid b{display:block;font-size:15px;color:var(--navy);font-weight:800}
.rankgrid .top b{color:#b8860b}

/* スコア */
.score-big{display:flex;align-items:center;justify-content:center;gap:16px;background:var(--navy);color:#fff;border-radius:16px;padding:14px;border:3px solid var(--yellow)}
.score-big .tm{text-align:center;font-size:12px;font-weight:500;max-width:110px}
.score-big .pt{font-size:40px;color:var(--yellow);line-height:1}
.mvp-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#fff6d3,#ffd659);border:3px solid #e7b625;border-radius:18px;padding:12px;cursor:pointer;position:relative;overflow:hidden}
.mvp-card .ttl{font-size:12px;color:#7a5600}
.mvp-card .nm{font-size:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(420px) rotate(720deg);opacity:.2}}

/* トースト・ローディング */
.card-ava{position:relative;flex:none;display:inline-block}
.card-ava img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;border-radius:7px;border:2px solid var(--yellow);box-shadow:0 3px 8px rgba(0,0,0,.25);display:block;background:#0b1433}
.card-crown{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-style:normal;font-size:18px;z-index:1;animation:bob 1.6s ease-in-out infinite}
.card-big{margin:2px auto 4px;display:flex;justify-content:center}
.card-zoom{border:none;background:none;padding:0;flex:none;position:relative;z-index:1}
#lightbox{position:fixed;inset:0;z-index:70;background:rgba(5,10,30,.88);display:grid;place-items:center;padding:20px}
#lightbox img{max-width:min(420px,90vw);max-height:80vh;border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.6);border:3px solid var(--yellow);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.6) rotate(-6deg);opacity:0}}
#toast{position:fixed;z-index:60;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 70px);transform:translateX(-50%) translateY(20px);opacity:0;background:var(--navy);color:#fff;border:2px solid var(--yellow);border-radius:999px;padding:10px 18px;font-size:13px;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#loading{position:fixed;inset:0;z-index:100;background:var(--navy);color:#fff;display:grid;place-items:center;text-align:center;transition:opacity .5s}
#loading .ball{width:56px;height:56px;border-radius:50%;background:#fff;margin:0 auto 14px;position:relative;animation:spin 1s linear infinite;box-shadow:0 0 0 4px var(--yellow)}
#loading .ball::before,#loading .ball::after{content:'';position:absolute;top:6px;bottom:6px;width:16px;border:3px dashed #e33;border-top:none;border-bottom:none}
#loading .ball::before{left:4px;border-left:none;border-radius:0 50% 50% 0}
#loading .ball::after{right:4px;border-right:none;border-radius:50% 0 0 50%}
@keyframes spin{to{transform:rotate(360deg)}}
#loading{background:#0b1433}
.logo-bounce{display:block;margin:0 auto 10px;max-width:60vw;height:auto;animation:lb 1.2s ease-in-out infinite}
@keyframes lb{50%{transform:translateY(-8px) scale(1.03)}}
@media (min-width:900px){ #header .logo b{font-size:18px} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="loading"><div><img src="logo-512.png" alt="Wild Rovers" class="logo-bounce" width="220" height="220"><div>ボールパークを準備中…</div></div></div>

<header id="header">
  <div class="logo">
    <img src="icon-192.png" width="46" height="46" alt="Wild Rovers" style="flex:none;border-radius:10px;margin:-4px -2px">
    <div><b>ワイルドローバーズ</b><small>WILD ROVERS BALLPARK</small></div>
  </div>
  <select id="seasonSel" class="pill-select" aria-label="シーズン"></select>
  <button id="bgmBtn" class="bgm-btn" aria-label="BGMのオン・オフ" title="BGM">🔇</button>
  <button id="modeBtn" class="mode-btn" aria-label="表示切替">2D</button>
</header>
<div id="banner" class="hidden"></div>

<div id="stage"></div>
<div id="tapHint">ドラッグで回転・ピンチで拡大／選手や看板をタップ！</div>
<div id="hud" class="hidden">
  <button class="round-btn on" id="rotBtn" title="自動回転">🔄</button>

</div>

  <button class="chip" data-spot="score">📋 スコアボード</button>

    <button class="icon-btn" id="backBtn" aria-label="戻る">‹</button>

</nav>
<div id="toast"></div>

<script src="wr-core.js?v=20261024202446"></script>
<script src="logo-data.js"></script>
<script type="module">
const C = window.WRCore;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const UNREG = '<span class="unreg">未登録</span>';
const num = v => C.isNum(v) ? v : UNREG;
const rate = (v, depsOk, f) => !depsOk ? UNREG : (C.isNum(v) ? f(v) : '—');
const params = new URLSearchParams(location.search);
const TEST = params.has('test');
const PREVIEW = params.has('preview');

/* ================= 状態 ================= */
const S = {
  data: null, season: null, source: '', mode: '3d', stack: [], my: null,
  gamesOrder: 'desc', boardCat: 'AVG', kind: 'all'
};
try { S.my = localStorage.getItem('wr-my-player'); S.kind = localStorage.getItem('wr-kind') || 'all'; } catch (e) {}

function toast(msg, ms = 2400) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms);
}

/* ================= データ読み込み ================= */
async function load() {
  let res;
  if (PREVIEW) {
    try {
      const d = JSON.parse(localStorage.getItem(TEST ? 'wr-admin-draft-test' : 'wr-admin-draft') || 'null');
      if (d) res = { raw: d.data || d, source: 'preview' };
    } catch (e) {}
  }
  if (!res) {
    try { res = await C.loadData({ base: TEST ? 'testdata/' : '', cacheName: TEST ? 'test' : 'main' }); }
    catch (e) { res = { raw: null, source: 'none' }; }
  }
  const norm = C.normalize(res.raw);
  if (norm.warnings.length) console.warn(norm.warnings);
  S.data = norm.data; S.source = res.source;
  const st = S.data.rankings.settings;
  if (!S.season || st.seasons.indexOf(S.season) < 0) S.season = st.currentSeason;
  // バナー表示
  const b = $('#banner'); b.className = ''; b.innerHTML = '';
  const msgs = [];
  if (TEST) { b.classList.add('test'); msgs.push('🧪 テストデータ表示中（架空の選手です／本番の成績ではありません）'); }
  if (PREVIEW) msgs.push('👀 管理画面の下書きをプレビュー中（まだ公開されていません）');
  if (res.source === 'cache') msgs.push('📴 通信できないため、前回保存したデータを表示中（' + (res.cachedAt || '').slice(0, 10) + '）');
  if (res.source === 'none') msgs.push('⚠️ データを読み込めませんでした');
  if (msgs.length) { b.innerHTML = msgs.map(esc).join('<br>'); b.onclick = () => b.classList.add('hidden'); setTimeout(() => b.classList.add('hidden'), 7000); }
  else b.classList.add('hidden');
  const sel = $('#seasonSel');
  // シーズン × 試合の種類（全試合 / 大会 / 練習試合）
  sel.innerHTML = st.seasons.slice().reverse().map(s => `<optgroup label="${esc(s)}年">${['all', 'tour', 'prac'].map(k => `<option value="${esc(s)}|${k}">${esc(s)}年 ${C.KIND_LABEL[k]}</option>`).join('')}</optgroup>`).join('');
  sel.value = S.season + '|' + S.kind;
}
const D = () => S.data;
// 今の集計範囲（シーズン＋試合の種類）と、その表示名
const SC = () => ({ season: S.season, kind: S.kind });
const SL = () => `${S.season}年${S.kind === 'all' ? '' : '・' + C.KIND_LABEL[S.kind]}`;
function setScope(season, kind) {
  S.season = season; S.kind = kind;
  try { localStorage.setItem('wr-kind', kind); } catch (e) {}
  $('#seasonSel').value = S.season + '|' + S.kind;
  World && World.refresh(); if (S.mode === '2d') renderHome2D(); refreshSheet();
  toast(SL() + 'の成績を表示中');
}
// 画面の上に出す「全試合／大会／練習試合」切り替えボタン
const kindChips = () => `<div class="chips kind-chips">${['all', 'tour', 'prac'].map(k => `<button class="chip ${S.kind === k ? 'on' : ''}" data-kind="${k}">${k === 'tour' ? '🏆 ' : k === 'prac' ? '⚾ ' : ''}${C.KIND_LABEL[k]}</button>`).join('')}</div>`;
const P = id => C.playerById(D(), id);
const activePlayers = () => D().players.players.filter(p => p.active !== false)
  .sort((a, b) => (parseInt(a.number, 10) || 9999) - (parseInt(b.number, 10) || 9999));

/* ================= 選手カードの読み込み ================= */
function loadCards() {
  const apply = map => {
    S.cards = {};
    // data URI のままだと重いので、ブラウザ内の短いURL（blob:）に変換
    Object.entries(map || {}).forEach(([id, uri]) => {
      if (String(uri).indexOf('data:') !== 0) { S.cards[id] = uri; return; } // URL・置き場所で登録したカード
      try { const [h, b64] = uri.split(','); const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); S.cards[id] = URL.createObjectURL(new Blob([u8], { type: h.slice(5, h.indexOf(';')) })); }
      catch (e) { S.cards[id] = uri; }
    });
    if (!Object.keys(S.cards).length) return;
    if (S.mode === '2d') renderHome2D();
    if (S.stack.length) { const keep = $('#sheetBody').scrollTop; refreshSheet(); $('#sheetBody').scrollTop = keep; }
  };
  if (PREVIEW) { try { const c = JSON.parse(localStorage.getItem(TEST ? 'wr-admin-cards-test' : 'wr-admin-cards') || 'null'); if (c && c.cards) return apply(c.cards); } catch (e) {} }
  const sc = document.createElement('script');
  sc.src = (TEST ? 'testdata/' : '') + 'cards.js?t=' + Date.now();
  sc.onload = () => apply(window.WR_CARDS);
  document.head.appendChild(sc);
}

/* ================= 2Dアバター（オリジナルデザイン） ================= */
// 選手ごとの見た目（players.json の look。写真を参考に作成。未設定なら標準）
const LOOK_DEFAULT = { build: 'normal', hair: 'short', hairColor: '#1c1714', cap: 'normal', glasses: 'none', face: 'normal', brows: 'normal', sleeveL: '#12235a', sleeveR: '#12235a' };
const lookOf = p => Object.assign({}, LOOK_DEFAULT, (p && p.look) || {});
const BUILD_W = { slim: 22, normal: 26, sturdy: 30, chubby: 33, muscle: 30 };
// 選手カード（admin.html で ChatGPT などで作った画像）。あれば2Dキャラクターの代わりに表示
const cardOf = p => p && S.cards && S.cards[p.id];
function avatar(p, size = 64, crown = false) {
  const cu = cardOf(p);
  if (cu) return `<span class="card-ava" style="width:${Math.round(size * 0.78)}px;height:${Math.round(size * 1.15)}px">${crown ? '<i class="card-crown">👑</i>' : ''}<img src="${cu}" alt="" loading="lazy"></span>`;
  const no = esc(p ? (p.number || '') : '?');
  const L = lookOf(p), bw = BUILD_W[L.build] || 26, hc = esc(L.hairColor);
  const headR = L.face === 'round' || L.build === 'chubby' ? 31 : 29;
  const hy = 52, top = hy - headR;
  let back = '', capSvg = '', hairFront = '', extra = '';
  // 髪（帽子の下からのぞく部分）
  if (L.hair === 'long') back += `<path d="M${50 - headR - 2} ${hy} q-2 26 8 30 h8 v-26z M${50 + headR + 2} ${hy} q2 26 -8 30 h-8 v-26z" fill="${hc}"/>`;
  if (L.hair === 'wavy') hairFront += [24, 30, 70, 76].map((x, i) => `<circle cx="${x}" cy="${hy - 2 + (i % 2) * 6}" r="5" fill="${hc}"/>`).join('');
  if (L.hair !== 'long' && L.cap !== 'none') hairFront += `<path d="M${50 - headR + 1} ${hy - 2} q2 10 5 12 v-12z M${50 + headR - 1} ${hy - 2} q-2 10 -5 12 v-12z" fill="${hc}"/>`;
  // 帽子
  if (L.cap === 'none') {
    capSvg = L.hair === 'spiky'
      ? `<path d="M${50 - headR} ${hy - 2} L26 ${top + 2} 33 ${top + 8} 38 ${top - 4} 45 ${top + 5} 51 ${top - 6} 57 ${top + 5} 63 ${top - 4} 68 ${top + 8} 75 ${top + 2} ${50 + headR} ${hy - 2} q-6 -6 -14 -4 q-15 -6 -30 0 q-8 -2 -15 4z" fill="${hc}"/>`
      : `<path d="M${50 - headR} ${hy + 2} a${headR} ${headR} 0 0 1 ${headR * 2} 0 q-8 -9 -22 -7 q-10 -5 -20 0 q-10 -1 -16 7z" fill="${hc}"/>`;
  } else if (L.cap === 'backward') {
    capSvg = `<ellipse cx="50" cy="${top + 4}" rx="20" ry="5" fill="#ffc928" transform="rotate(-8 50 ${top + 4})"/><path d="M${50 - headR + 1} ${hy - 4}a${headR - 1} ${headR - 1} 0 0 1 ${(headR - 1) * 2} 0z" fill="#12235a"/><rect x="44" y="${hy - 9}" width="12" height="4" rx="2" fill="#ffc928"/>`;
  } else if (L.cap === 'helmet') {
    capSvg = `<path d="M${50 - headR - 2} ${hy + 2}a${headR + 2} ${headR + 2} 0 0 1 ${(headR + 2) * 2} 0z" fill="#0f1c4d"/><path d="M${50 - headR - 2} ${hy + 2}a${headR + 2} ${headR + 2} 0 0 1 14 -22" stroke="#3b56b0" stroke-width="3" fill="none" opacity=".7"/><ellipse cx="50" cy="${hy + 2}" rx="${headR + 5}" ry="4" fill="#0f1c4d"/><text x="50" y="${hy - 10}" text-anchor="middle" font-size="12" font-weight="900" fill="#ffc928" font-family="Arial Black,Arial">W</text>`;
  } else {
    capSvg = `<path d="M${50 - headR} ${hy - 2}a${headR} ${headR} 0 0 1 ${headR * 2} 0z" fill="#12235a"/><path d="M${54 - headR} ${hy - 2}h${headR * 2 - 8}c3 0 6 3 6 6H${48 - headR}c0-3 0-6 2-6z" fill="#ffc928"/><circle cx="50" cy="${top + 1}" r="3" fill="#ffc928"/><text x="50" y="${hy - 7}" text-anchor="middle" font-size="12" font-weight="900" fill="#ffc928" font-family="Arial Black,Arial">W</text>`;
  }
  // 顔
  const eyeRy = L.face === 'cool' ? 3.4 : 5;
  const eyes = L.face === 'grin'
    ? `<path d="M35 66q4 -5 8 0M57 66q4 -5 8 0" stroke="#1d1d2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="39" cy="66" rx="3.6" ry="${eyeRy}" fill="#1d1d2b"/><ellipse cx="61" cy="66" rx="3.6" ry="${eyeRy}" fill="#1d1d2b"/><circle cx="40" cy="64.5" r="1.2" fill="#fff"/><circle cx="62" cy="64.5" r="1.2" fill="#fff"/>`;
  const mouth = { smile: '<path d="M42 74q8 7 16 0" stroke="#8a3b2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>', grin: '<path d="M41 73h18q-2 9 -9 9t-9 -9z" fill="#8a2b2b"/><path d="M42 73.5h16v2.5h-16z" fill="#fff"/>', cool: '<path d="M45 76h10" stroke="#8a3b2b" stroke-width="2.4" stroke-linecap="round"/>' }[L.face] || '<path d="M44 75q6 5 12 0" stroke="#8a3b2b" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  if (L.brows === 'thick') extra += '<path d="M33 58l11 -1M56 57l11 1" stroke="#1d1d2b" stroke-width="3.4" stroke-linecap="round"/>';
  if (L.glasses === 'round') extra += '<circle cx="39" cy="66" r="8" fill="none" stroke="#222" stroke-width="2.4"/><circle cx="61" cy="66" r="8" fill="none" stroke="#222" stroke-width="2.4"/><path d="M47 66h6" stroke="#222" stroke-width="2.4"/>';
  if (L.glasses === 'sport') extra += '<defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="#ff3d2e"/><stop offset=".5" stop-color="#ffb02e"/><stop offset="1" stop-color="#ff3d2e"/></linearGradient></defs><path d="M27 61q23 -6 46 0l-2 9q-8 4 -17 -1h-8q-9 5 -17 1z" fill="url(#sg)" stroke="#222" stroke-width="1.5"/>';
  const gear = L.gear === 'catcher' ? `<path d="M${50 - bw + 6} 76q${bw - 6} -6 ${(bw - 6) * 2} 0v20q-${bw - 6} 8 -${(bw - 6) * 2} 0z" fill="#c8323c" stroke="#7d1b22" stroke-width="1.5"/>` : '';
  const arms = `<ellipse cx="${50 - bw - 2}" cy="88" rx="6" ry="11" fill="${esc(L.sleeveR)}"/><ellipse cx="${50 + bw + 2}" cy="88" rx="6" ry="11" fill="${esc(L.sleeveL)}"/><circle cx="${50 - bw - 2}" cy="99" r="5" fill="#ffd9b8"/><circle cx="${50 + bw + 2}" cy="99" r="5" fill="#ffd9b8"/>`;
  return `<svg width="${size}" height="${size * 1.15}" viewBox="0 0 100 115" aria-hidden="true" style="flex:none">
  ${crown ? `<path d="M30 ${top - 14} 38 ${top - 2} 50 ${top - 20} 62 ${top - 2} 70 ${top - 14} 68 ${top + 4}H32z" fill="#f5c542" stroke="#b8860b" stroke-width="2"/>` : ''}
  <ellipse cx="50" cy="110" rx="${bw}" ry="4.5" fill="rgba(0,0,0,.15)"/>
  ${back}${arms}
  <ellipse cx="50" cy="88" rx="${bw}" ry="22" fill="#12235a"/>
  ${L.build === 'muscle' ? `<ellipse cx="${50 - bw + 4}" cy="74" rx="8" ry="6" fill="#12235a"/><ellipse cx="${50 + bw - 4}" cy="74" rx="8" ry="6" fill="#12235a"/>` : ''}
  <rect x="${50 - bw + 2}" y="96" width="${(bw - 2) * 2}" height="5" rx="2" fill="#ffc928"/>
  ${gear}
  <text x="50" y="94" text-anchor="middle" font-size="19" font-weight="900" fill="#ffc928" font-family="Arial Black,Arial">${no}</text>
  <circle cx="50" cy="${hy}" r="${headR}" fill="#ffd9b8"/>
  ${hairFront}${capSvg}
  ${eyes}
  <circle cx="30" cy="73" r="4.5" fill="#ff9e8f" opacity=".6"/><circle cx="70" cy="73" r="4.5" fill="#ff9e8f" opacity=".6"/>
  ${mouth}${extra}
  </svg>`;
}
const pname = id => { if (id === C.GUEST) return '助っ人'; const p = P(id); return p ? esc(p.name) : '<span class="unreg">（削除された選手）</span>'; };
const kindTag = g => `<span class="badge ${C.gameKind(g) === 'tour' ? 'gold' : ''}" style="margin:0 0 0 4px;padding:1px 8px;font-size:11px">${C.gameKind(g) === 'tour' ? '🏆 大会' : '練習試合'}</span>`;
const ptag = p => `<span class="num-tag">${esc(p.number)}</span>`;

function confetti(el, n = 40) {
  const box = document.createElement('div'); box.className = 'confetti';
  const colors = ['#ffc928', '#12235a', '#ff6b6b', '#4cc3ff', '#5cbf4f', '#fff'];
  for (let i = 0; i < n; i++) {
    const c = document.createElement('i');
    c.style.left = Math.random() * 100 + '%';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * .6) + 's';
    box.appendChild(c);
  }
  el.appendChild(box); setTimeout(() => box.remove(), 4200);
}

/* ================= 画面（ビュー） ================= */
const VIEWS = {};

// --- 選手名鑑
VIEWS.roster = () => {
  const ps = D().players.players.slice().sort((a, b) => (a.active === false) - (b.active === false) || (parseInt(a.number, 10) || 9999) - (parseInt(b.number, 10) || 9999));
  if (!ps.length) return { title: '⚾ 選手名鑑', html: emptyMsg('選手がまだ登録されていません。') };
  const note = S.kind === 'all' ? '' : `（${C.KIND_LABEL[S.kind]}だけ。WPは${C.KIND_LABEL[S.kind]}のMVP・準MVPの分だけで、手入力のWPは含みません）`;
  const html = `${kindChips()}<div class="muted" style="margin:-4px 0 8px">MVP・準MVPの回数とWPは ${esc(SL())} の集計です${note}</div><div class="roster">${ps.map(p => {
    const wp = C.wpSummary(D(), p.id, SC()).current, m = C.mvpCounts(D(), p.id, SC());
    return `<div class="pcard ${p.active === false ? 'inactive' : ''}" data-player="${esc(p.id)}">
      <span class="wp">${m.game ? `<b class="mv1">🏆MVP ${m.game}回</b>` : ''}${m.game2 ? `<b class="mv2">🥈準MVP ${m.game2}回</b>` : ''}</span>${cardOf(p) ? `<div class="card-big">${avatar(p, 128)}</div>` : avatar(p, 70)}
      <div class="nm">${esc(p.name)}</div>
      <div class="pos">${p.number ? `#${esc(p.number)}・` : ''}${esc(p.position || '未登録')}${p.active === false ? '・休部/退団' : ''}</div>
      <div class="wpline">${wp.toLocaleString('ja-JP')} WP</div></div>`;
  }).join('')}</div>`;
  return { title: '⚾ 選手名鑑', html };
};

// --- ランキング
VIEWS.ranking = (prm = {}) => {
  const key = prm.key || S.boardCat || 'AVG';
  const r = C.ranking(D(), SC(), key);
  const cat = r.category, q = r.qualifiers;
  const GROUPS = [['bat', '🏏 打撃'], ['pit', '⚾ 投手'], ['etc', '🏅 その他']];
  const chips = GROUPS.map(([g, lab]) => `<div class="chips" style="margin-bottom:0;align-items:center"><span class="muted" style="flex:none;font-size:11px;min-width:44px">${lab}</span>${C.CATEGORIES.filter(c => c.group === g).map(c => `<button class="chip ${c.key === key ? 'on' : ''}" data-rank="${c.key}">${c.label}</button>`).join('')}</div>`).join('') +
    `<div class="row" style="margin:6px 0 10px"><button class="btn w sm" data-go="table" data-key="${cat.group === 'pit' ? 'pit' : 'bat'}">📋 全選手・全項目の成績一覧表</button></div>`;
  let qual = '';
  if (cat.rate === 'bat') qual = `規定打席：<b>${q.PA}</b>打席（チーム${q.teamGames}試合 × ${D().rankings.settings.qualifyPAPerGame}）。未到達 ${r.unqualified}人は表示されません。`;
  if (cat.rate === 'pit') qual = `規定投球回：<b>${C.outsToIPText(q.outs)}</b>（${q.ipFixed ? '固定' : `チーム${q.teamGames}試合 × ${D().rankings.settings.qualifyIPPerGame}回`}）。未到達 ${r.unqualified}人は表示されません。防御率は${D().rankings.settings.eraInnings}回換算。`;
  if (key === 'MVP2') qual = '試合の準MVPに選ばれた回数です。';
  if (cat.group !== 'etc' && !cat.rate) qual = `${cat.higher ? '多い順' : '少ない順'}。0の選手は表示しません。`;
  if (key === 'MVP') qual = '試合MVPの獲得回数です（月間・年間MVPは選手プロフィールに表示）。';
  if (key === 'WP') qual = (S.kind === 'all' ? '今シーズンの獲得WP合計。' : `${C.KIND_LABEL[S.kind]}のMVP・準MVPで付いたWPだけの合計です（手入力のWPは「全試合」のときだけ数えます）。`) + '「▲▼」は最新の付与日より前の順位との比較です。';
  const list = r.items.length ? r.items.map(it => {
    const cls = it.rank <= 3 ? 'r' + it.rank : '';
    let chg = '';
    if (key === 'WP') {
      if (it.change > 0) chg = `<span class="chg up">▲${it.change}</span>`;
      else if (it.change < 0) chg = `<span class="chg down">▼${-it.change}</span>`;
      else if (it.change === 0) chg = `<span class="chg">→</span>`;
    }
    return `<div class="rk ${cls}" data-player="${esc(it.playerId)}">${it.rank === 1 ? '<div class="spot"></div>' : ''}
      <div class="no">${it.rank}</div>${avatar(it.player, 36, it.rank === 1)}
      <div class="grow" style="flex:1;min-width:0"><div class="nm" style="font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ptag(it.player)}${esc(it.player.name)}</div>
      <div class="muted">${esc(it.sub || it.player.position || '')}</div></div>
      <div><div class="val">${esc(it.display)}<small>${esc(cat.unit)}</small></div>${chg}</div></div>`;
  }).join('') : emptyMsg('このランキングの対象データがまだありません。');
  return {
    title: `🏆 ${cat.label}ランキング`,
    html: `${kindChips()}${chips}<div class="card" style="padding:10px 12px"><div class="muted">${esc(SL())}</div><div class="note" style="margin-top:2px">${qual}同じ数値は同順位。同順位の中は背番号の小さい順に並べています。</div></div>${list}`,
    after: el => { if (r.items[0]) setTimeout(() => confetti(el.querySelector('.rk.r1') || el, 18), 200); }
  };
};

// --- 成績一覧表（全選手 × 全項目。見出しを押すと並べ替え）
const TABLE_COLS = {
  bat: [['G', '試合'], ['PA', '打席'], ['AB', '打数'], ['H', '安打'], ['D', '二塁打'], ['T', '三塁打'], ['HR', '本塁打'], ['TB', '塁打'], ['RBI', '打点'], ['R', '得点'], ['SB', '盗塁'],
    ['BB', '四球'], ['HBP', '死球'], ['SH', '犠打'], ['SF', '犠飛'], ['SO', '三振'], ['AVG', '打率', C.fmtRate3], ['OBP', '出塁率', C.fmtRate3], ['SLG', '長打率', C.fmtRate3], ['OPS', 'OPS', C.fmtRate3]],
  pit: [['G', '登板'], ['outs', '投球回', C.outsToIPText], ['W', '勝'], ['L', '敗'], ['SV', 'S'], ['SO', '奪三振'], ['BB', '与四球'], ['H', '被安打'], ['R', '失点'], ['ER', '自責点'],
    ['ERA', '防御率', C.fmt2], ['WHIP', 'WHIP', C.fmt2]]
};
S.tableSort = { bat: { k: 'OPS', dir: -1 }, pit: { k: 'ERA', dir: 1 } };
VIEWS.table = (prm = {}) => {
  const type = prm.key === 'pit' ? 'pit' : 'bat', d = D(), sc = SC(), q = C.qualifiers(d, sc), cols = TABLE_COLS[type];
  const srt = S.tableSort[type];
  const agg = type === 'bat' ? C.aggregateBatting : C.aggregatePitching;
  const rows = d.players.players.map(p => ({ p, s: agg(d, p.id, sc) })).filter(r => r.s.registered);
  rows.forEach(r => { r.q = type === 'bat' ? C.isNum(r.s.PA) && r.s.PA >= q.PA : C.isNum(r.s.outs) && r.s.outs >= q.outs; });
  const isRate = ['AVG', 'OBP', 'SLG', 'OPS', 'ERA', 'WHIP'].includes(srt.k);
  rows.sort((a, b) => {
    if (isRate && a.q !== b.q) return a.q ? -1 : 1; // 率の項目は規定到達者を先に
    const va = a.s[srt.k], vb = b.s[srt.k];
    if (!C.isNum(va) && !C.isNum(vb)) return 0; if (!C.isNum(va)) return 1; if (!C.isNum(vb)) return -1;
    return (va - vb) * srt.dir || (parseInt(a.p.number, 10) || 999) - (parseInt(b.p.number, 10) || 999);
  });
  // チーム合計（回数は合計、率は合計から同じ計算式で）
  const sum = {}; cols.forEach(([k]) => { sum[k] = rows.reduce((t, r) => t + (C.isNum(r.s[k]) ? r.s[k] : 0), 0); });
  if (type === 'bat') {
    const g = C.teamRecord(d, sc).G; sum.G = g;
    sum.AVG = sum.AB ? sum.H / sum.AB : null; const od = sum.AB + sum.BB + sum.HBP + sum.SF;
    sum.OBP = od ? (sum.H + sum.BB + sum.HBP) / od : null; sum.SLG = sum.AB ? sum.TB / sum.AB : null; sum.OPS = C.isNum(sum.OBP) && C.isNum(sum.SLG) ? sum.OBP + sum.SLG : null;
  } else {
    sum.G = C.teamRecord(d, sc).G; const inn = sum.outs / 3, eraInn = Number(d.rankings.settings.eraInnings) || 9;
    sum.ERA = inn ? sum.ER * eraInn / inn : null; sum.WHIP = inn ? (sum.BB + sum.H) / inn : null;
  }
  const cell = (s, k, f) => { const v = s[k]; return C.isNum(v) ? esc(f ? f(v) : v) : (v === null && s.registered ? '—' : UNREG); };
  const head = `<tr><th class="l sticky">選手</th>${cols.map(([k, lab]) => `<th data-tsort="${k}" data-ttype="${type}" style="cursor:pointer;${srt.k === k ? 'color:var(--navy);font-weight:800' : ''}">${lab}${srt.k === k ? (srt.dir < 0 ? '▼' : '▲') : ''}</th>`).join('')}</tr>`;
  const body = rows.map(r => `<tr data-player="${esc(r.p.id)}" style="cursor:pointer"><td class="l sticky">${r.q ? '' : '<span title="規定未到達" style="color:#9aa3b8">・</span>'}${r.p.number ? `<span class="num-tag">${esc(r.p.number)}</span>` : ''}${esc(r.p.name)}</td>${cols.map(([k, , f]) => `<td${srt.k === k ? ' style="background:#fff6d3;font-weight:800"' : ''}>${cell(r.s, k, f)}</td>`).join('')}</tr>`).join('');
  const total = `<tr style="background:#eef2fb;font-weight:800"><td class="l sticky" style="background:#eef2fb">チーム合計</td>${cols.map(([k, , f]) => `<td>${C.isNum(sum[k]) ? esc(f ? f(sum[k]) : sum[k]) : '—'}</td>`).join('')}</tr>`;
  return {
    title: '📋 成績一覧表',
    html: `${kindChips()}<div class="chips"><button class="chip ${type === 'bat' ? 'on' : ''}" data-go="table" data-key="bat">🏏 打撃成績</button><button class="chip ${type === 'pit' ? 'on' : ''}" data-go="table" data-key="pit">⚾ 投手成績</button></div>
      <div class="card" style="padding:8px"><div class="muted" style="padding:0 4px 6px">${esc(SL())}・${rows.length}人。見出しを押すと並べ替え／選手名を押すと詳しく。「・」は${type === 'bat' ? `規定打席（${q.PA}打席）` : `規定投球回（${C.outsToIPText(q.outs)}）`}未到達。</div>
      <div class="tscroll"><table class="t stat-table">${head}${body || `<tr><td class="l" colspan="${cols.length + 1}">データが未登録です</td></tr>`}${rows.length ? total : ''}</table></div></div>
      <div class="note">打率＝安打÷打数、出塁率＝(安打＋四球＋死球)÷(打数＋四球＋死球＋犠飛)、長打率＝塁打÷打数、OPS＝出塁率＋長打率、防御率＝自責点×${D().rankings.settings.eraInnings}÷投球回、WHIP＝(与四球＋被安打)÷投球回</div>`
  };
};

// --- 選手プロフィール
VIEWS.profile = ({ id }) => {
  const p = P(id);
  if (!p) return { title: '選手', html: emptyMsg('この選手は見つかりません。') };
  const d = D(), s = SC(), sl = SL();
  const b = C.aggregateBatting(d, id, s), pt = C.aggregatePitching(d, id, s), f = C.aggregateFielding(d, id, s);
  const m = C.mvpCounts(d, id, s), mAll = C.mvpCounts(d, id, { season: null, kind: S.kind });
  const wp = C.wpSummary(d, id, s), ranks = C.playerRanks(d, id, s);
  const titles = C.playerTitles(d, id, s), badges = C.playerBadges(d, id);
  const bOk = (...k) => k.every(x => C.isNum(b[x]));
  const pOk = (...k) => k.every(x => C.isNum(pt[x]));
  const tile = (l, v, hl) => `<div class="stat ${hl ? 'hl' : ''}"><div class="l">${l}</div><div class="v">${v}</div></div>`;
  const rankCell = (c) => {
    const r = ranks[c.key];
    if (r) return `<div class="${r.rank <= 3 ? 'top' : ''}">${c.label}<b>${r.rank === 1 ? '👑' : ''}${r.rank}位<small style="font-size:10px;color:var(--muted)">/${r.of}</small></b></div>`;
    let why = '未登録';
    if (c.rate === 'bat' && b.registered && C.isNum(b[c.field])) why = '規定未到達';
    if (c.rate === 'pit' && pt.registered && C.isNum(pt[c.field])) why = '規定未到達';
    if (!c.rate && c.group !== 'etc' && (c.group === 'bat' ? b.registered : pt.registered)) why = '0';
    return `<div>${c.label}<b style="font-size:12px;color:#9aa3b8">${why}</b></div>`;
  };
  const wpR = ranks.WP;
  const chg = wpR && wpR.change != null ? (wpR.change > 0 ? `▲${wpR.change}` : wpR.change < 0 ? `▼${-wpR.change}` : '→') : '—';

  // 過去の成績（シーズン別）
  const seasons = d.rankings.settings.seasons;
  const pastRows = seasons.map(se => {
    const sco = { season: se, kind: S.kind }, bb = C.aggregateBatting(d, id, sco), pp = C.aggregatePitching(d, id, sco);
    return `<tr><td class="l">${esc(se)}</td><td>${bb.registered ? bb.G : UNREG}</td><td>${rate(bb.AVG, bb.registered && C.isNum(bb.AB), C.fmtRate3)}</td><td>${bb.registered ? num(bb.HR) : UNREG}</td><td>${bb.registered ? num(bb.RBI) : UNREG}</td><td>${rate(bb.OPS, bb.registered && C.isNum(bb.AB), C.fmtRate3)}</td>
      <td>${pp.registered ? pp.G : UNREG}</td><td>${pp.registered ? `${num(pp.W)}-${num(pp.L)}` : UNREG}</td><td>${rate(pp.ERA, pp.registered && C.isNum(pp.outs), C.fmt2)}</td></tr>`;
  }).join('');
  const tb = C.aggregateBatting(d, id, { season: null, kind: S.kind }), tp = C.aggregatePitching(d, id, { season: null, kind: S.kind });
  // 大会・練習試合別（このシーズン）
  const splitRow = k => {
    const sco = { season: S.season, kind: k }, bk = C.aggregateBatting(d, id, sco), pk = C.aggregatePitching(d, id, sco), mk = C.mvpCounts(d, id, sco);
    const ok = bk.registered && C.isNum(bk.AB), ak = C.attendance(d, id, sco);
    return `<tr${S.kind === k ? ' style="background:#fff6d3"' : ''}><td class="l">${k === 'tour' ? '🏆 ' : k === 'prac' ? '⚾ ' : ''}${C.KIND_LABEL[k]}</td>
      <td>${ak.games ? `${ak.attended}/${ak.games}<br><small>${C.fmtPct(ak.rate)}</small>` : '—'}</td><td>${bk.registered ? bk.G : UNREG}</td><td>${rate(bk.AVG, ok, C.fmtRate3)}</td><td>${bk.registered ? num(bk.H) : UNREG}</td><td>${bk.registered ? num(bk.HR) : UNREG}</td><td>${bk.registered ? num(bk.RBI) : UNREG}</td><td>${bk.registered ? num(bk.SB) : UNREG}</td><td>${rate(bk.OPS, ok, C.fmtRate3)}</td>
      <td>${pk.registered ? pk.G : UNREG}</td><td>${pk.registered ? C.outsToIPText(pk.outs) : UNREG}</td><td>${pk.registered ? `${num(pk.W)}-${num(pk.L)}` : UNREG}</td><td>${rate(pk.ERA, pk.registered && C.isNum(pk.outs), C.fmt2)}</td><td>${pk.registered ? num(pk.SO) : UNREG}</td><td>${mk.game}</td></tr>`;
  };
const at = C.attendance(d, id, s);
const attCard = `<div class="card"><h3>📅 出席<span class="sub">${esc(sl)}</span></h3>${at.games ? `<div class="stats">
  ${tile('出席率', C.fmtPct(at.rate), true)}${tile('出席', at.attended + '試合')}${tile('欠席', at.absent + '試合')}${tile('チーム試合数', at.games + '試合')}</div>
  <div style="margin-top:10px;height:12px;border-radius:999px;background:#e8ecf6;overflow:hidden"><div style="height:100%;width:${Math.round(at.rate * 100)}%;background:linear-gradient(90deg,var(--yellow),#ffb300)"></div></div>
  <div class="note">出席率＝出席した試合数÷チームの試合数。打席・登板などの成績がある試合と、管理画面で「出席」にした試合（ベンチ入りなど）を数えます。</div>` : '<div class="muted">この期間の試合はまだありません。</div>'}</div>`;
const splitCard = `<div class="card"><h3>🏆 大会・練習試合別<span class="sub">${esc(S.season)}年</span></h3><div class="tscroll"><table class="t">
    <tr><th class="l"></th><th>出席</th><th>試合</th><th>打率</th><th>安打</th><th>本</th><th>打点</th><th>盗塁</th><th>OPS</th><th>登板</th><th>投球回</th><th>勝-敗</th><th>防御率</th><th>奪三振</th><th>MVP</th></tr>
    ${['all', 'tour', 'prac'].map(splitRow).join('')}</table></div></div>`;
  const totalRow = `<tr style="background:#fff6d3"><td class="l">通算</td><td>${tb.registered ? tb.G : UNREG}</td><td>${rate(tb.AVG, tb.registered && C.isNum(tb.AB), C.fmtRate3)}</td><td>${tb.registered ? num(tb.HR) : UNREG}</td><td>${tb.registered ? num(tb.RBI) : UNREG}</td><td>${rate(tb.OPS, tb.registered && C.isNum(tb.AB), C.fmtRate3)}</td><td>${tp.registered ? tp.G : UNREG}</td><td>${tp.registered ? `${num(tp.W)}-${num(tp.L)}` : UNREG}</td><td>${rate(tp.ERA, tp.registered && C.isNum(tp.outs), C.fmt2)}</td></tr>`;

  // 試合別
  const sg = C.seasonGames(d, s).slice().reverse();
  const gRows = sg.map(g => {
    const br = d.stats.batting.find(r => r.gameId === g.id && r.playerId === id);
    const pr = d.stats.pitching.find(r => r.gameId === g.id && r.playerId === id);
    if (!br && !pr) return '';
    return `<tr data-game="${esc(g.id)}" style="cursor:pointer"><td class="l">${esc(g.date.slice(5).replace('-', '/'))}</td><td class="l" style="max-width:110px;overflow:hidden;text-overflow:ellipsis">${esc(g.opponent)}</td>
      <td>${br ? `${num(br.AB)}-${num(br.H)}` : '—'}</td><td>${br ? num(br.HR) : '—'}</td><td>${br ? num(br.RBI) : '—'}</td><td>${pr ? C.outsToIPText(pr.outs) : '—'}</td><td>${g.mvp === id ? '🏅' : ''}</td></tr>`;
  }).join('');

  const html = `
  ${kindChips()}
  <div class="hero">${cardOf(p) ? `<button class="card-zoom" data-zoomcard="${esc(p.id)}" aria-label="カードを拡大">${avatar(p, 128, ranks.WP && ranks.WP.rank === 1)}</button>` : avatar(p, 86, ranks.WP && ranks.WP.rank === 1)}
    <div style="position:relative;z-index:1;min-width:0">
      <div class="big-no">#${esc(p.number || '—')}</div>
      <div class="nm">${esc(p.name)}</div>
      <div class="meta">${esc(p.position || 'ポジション未登録')}・${p.throws || p.bats ? `${esc(p.throws || '?')}投${esc(p.bats || '?')}打` : '投打 未登録'}${p.active === false ? '・休部/退団' : ''}</div>
      ${p.look && p.look.photo ? '<div class="meta">📷 キャラクターは登録写真を参考に作成</div>' : ''}
      ${p.comment ? `<div class="meta">${esc(p.comment)}</div>` : ''}
    </div></div>
  <div class="row" style="margin-bottom:12px">
    <button class="btn y sm" data-setmy="${esc(p.id)}">${S.my === p.id ? '⭐ 自分の選手に設定済み' : '☆ 自分の選手にする'}</button>
    <button class="btn w sm" data-share>🔗 この画面を共有</button>
  </div>
  ${attCard}
  ${splitCard}
  <div class="card"><h3>🏅 称号・タイトル<span class="sub">${esc(sl)}</span></h3>
    ${titles.length ? titles.map(t => `<span class="badge gold">👑 ${esc(t)}</span>`).join('') : ''}
    ${badges.length ? badges.map(x => `<span class="badge">${x.icon} ${esc(x.name)}</span>`).join('') : ''}
    ${!titles.length && !badges.length ? '<div class="muted">まだ称号はありません。試合に出て獲得しよう！</div>' : ''}
  </div>
  <div class="card"><h3>📈 チーム内ランキング<span class="sub">${esc(sl)}</span></h3><div class="rankgrid">${C.CATEGORIES.filter(c => c.main).map(rankCell).join('')}</div>
    <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">すべての種目の順位を見る（${C.CATEGORIES.length}種目）</summary>
    ${[['bat', '🏏 打撃'], ['pit', '⚾ 投手'], ['etc', '🏅 その他']].map(([g, lab]) => `<div class="muted" style="margin:8px 0 4px">${lab}</div><div class="rankgrid">${C.CATEGORIES.filter(c => c.group === g).map(rankCell).join('')}</div>`).join('')}</details></div>
  <div class="card"><h3>💎 WPポイント</h3><div class="stats">
    ${tile('今季WP', wp.current, true)}${tile('累計WP', wp.total)}${tile('WP順位', wpR ? wpR.rank + '位' : '—')}${tile('前回から', chg)}
    ${tile('試合MVP', m.game + '回', m.game > 0)}${tile('準MVP', m.game2 + '回')}${tile('月間MVP', m.month + '回')}${tile('年間MVP', m.year + '回')}${tile('通算MVP', mAll.game + '回')}
  </div>
  ${wp.history.length ? `<details style="margin-top:10px"><summary class="muted" style="cursor:pointer">WP獲得履歴（${wp.history.length}件）</summary>
    <table class="t" style="margin-top:6px"><tr><th class="l">日付</th><th class="l">内容</th><th>WP</th></tr>
    ${wp.history.map(h => `<tr><td class="l">${esc(h.date)}</td><td class="l" style="white-space:normal">${esc(h.reason || '')}</td><td style="color:${h.points < 0 ? 'var(--lose)' : 'var(--win)'}">${h.points > 0 ? '+' : ''}${h.points}</td></tr>`).join('')}</table></details>` : '<div class="note">WPの履歴はまだありません。</div>'}
  </div>
  <div class="card"><h3>🏏 打撃成績<span class="sub">${esc(sl)}</span></h3><div class="stats">
    ${tile('試合', b.registered ? b.G : UNREG)}${tile('打席', num(b.PA))}${tile('打数', num(b.AB))}${tile('安打', num(b.H))}

    ${tile('本塁打', num(b.HR))}${tile('打点', num(b.RBI))}${tile('得点', num(b.R))}${tile('盗塁', num(b.SB))}
    ${tile('四球', num(b.BB))}${tile('三振', num(b.SO))}${tile('二塁打', num(b.D))}${tile('三塁打', num(b.T))}
    ${tile('死球', num(b.HBP))}${tile('犠飛', num(b.SF))}${tile('犠打', num(b.SH))}
  </div></div>
  <div class="card"><h3>⚾ 投手成績<span class="sub">${esc(sl)}</span></h3><div class="stats">
    ${tile('登板', pt.registered ? pt.G : UNREG)}${tile('投球回', pt.registered ? C.outsToIPText(pt.outs) : UNREG)}${tile('勝利', num(pt.W))}${tile('敗戦', num(pt.L))}
    ${tile('セーブ', num(pt.SV))}${tile('奪三振', num(pt.SO))}${tile('与四球', num(pt.BB))}${tile('被安打', num(pt.H))}
    ${tile('失点', num(pt.R))}${tile('自責点', num(pt.ER))}${tile('防御率', rate(pt.ERA, pOk('ER', 'outs'), C.fmt2), true)}${tile('WHIP', rate(pt.WHIP, pOk('BB', 'H', 'outs'), C.fmt2))}
  </div></div>
  <div class="card"><h3>🧤 守備成績<span class="sub">${esc(sl)}</span></h3><div class="stats">
    ${tile('守備試合', f.registered ? f.G : UNREG)}${tile('刺殺', num(f.PO))}${tile('補殺', num(f.A))}${tile('失策', num(f.E))}
    ${tile('守備率', rate(f.FPCT, f.registered && C.isNum(f.PO) && C.isNum(f.A) && C.isNum(f.E), C.fmtRate3))}
  </div></div>
  <div class="card"><h3>📅 試合別成績<span class="sub">${esc(sl)}・タップで試合へ</span></h3>
    ${gRows ? `<div class="tscroll"><table class="t"><tr><th class="l">日付</th><th class="l">相手</th><th>打数-安打</th><th>本</th><th>点</th><th>投球回</th><th>MVP</th></tr>${gRows}</table></div>` : '<div class="muted">このシーズンの出場記録は未登録です。</div>'}
  </div>
  <div class="card"><h3>🗂️ 過去の成績<span class="sub">${C.KIND_LABEL[S.kind]}</span></h3><div class="tscroll"><table class="t">
    <tr><th class="l">年</th><th>試合</th><th>打率</th><th>本</th><th>打点</th><th>OPS</th><th>登板</th><th>勝-敗</th><th>防御率</th></tr>${pastRows}${totalRow}</table></div>
    <div class="note">打率・出塁率・長打率は小数第3位、防御率は${d.rankings.settings.eraInnings}回換算で小数第2位まで表示。打数0などで計算できない場合は「—」です。</div></div>`;
  return { title: `#${p.number} ${p.name}`, html };
};

// --- 個人成績（自分の選手）
VIEWS.me = () => {
  if (S.my && P(S.my)) return Object.assign(VIEWS.profile({ id: S.my }), { title: '📊 あなたの成績' });
  const ps = activePlayers();
  return {
    title: '📊 個人成績',
    html: `<div class="card"><h3>👋 あなたはどの選手？</h3><div class="muted">選ぶと次回から「個人成績」ですぐに自分の成績が開きます（この端末にだけ記憶されます）。</div></div>

// --- 試合詳細
VIEWS.game = ({ id }) => {
  const d = D(), g = C.gameById(d, id);
  if (!g) return { title: '試合', html: emptyMsg('試合が見つかりません。') };
  const r = C.gameResult(g);
  const bat = d.stats.batting.filter(x => x.gameId === id).sort((a, b) => (a.order || 99) - (b.order || 99) || (parseInt((P(a.playerId) || {}).number, 10) || 999) - (parseInt((P(b.playerId) || {}).number, 10) || 999));
  const pit = d.stats.pitching.filter(x => x.gameId === id);
  const hrs = bat.filter(x => C.isNum(x.HR) && x.HR > 0);
  const players = [...new Set([...bat.map(x => x.playerId), ...pit.map(x => x.playerId)])];
  const inn = g.innings && (g.innings.for || g.innings.against);
  const line = inn ? (() => {
    const n = Math.max((g.innings.for || []).length, (g.innings.against || []).length);
    const cells = arr => Array.from({ length: n }, (_, i) => `<td>${arr && arr[i] != null && arr[i] !== '' ? esc(arr[i]) : '-'}</td>`).join('');
    return `<div class="card"><h3>📋 スコアボード</h3><div class="tscroll"><table class="t"><tr><th class="l">チーム</th>${Array.from({ length: n }, (_, i) => `<th>${i + 1}</th>`).join('')}<th>計</th></tr>
      <tr><td class="l">${esc(g.topBottom === 'bottom' ? g.opponent : 'ワイロバ')}</td>${cells(g.topBottom === 'bottom' ? g.innings.against : g.innings.for)}<td><b>${g.topBottom === 'bottom' ? num(g.scoreAgainst) : num(g.scoreFor)}</b></td></tr>
      <tr><td class="l">${esc(g.topBottom === 'bottom' ? 'ワイロバ' : g.opponent)}</td>${cells(g.topBottom === 'bottom' ? g.innings.for : g.innings.against)}<td><b>${g.topBottom === 'bottom' ? num(g.scoreFor) : num(g.scoreAgainst)}</b></td></tr></table></div></div>`;
  })() : '';
  const html = `
  <div class="score-big"><div class="tm">ワイルド<br>ローバーズ</div><div class="pt">${num(g.scoreFor)}</div><div style="text-align:center">${r ? `<span class="res ${r}" style="font-size:16px;height:32px;min-width:44px">${r}</span>` : ''}<div class="muted" style="color:#c8d2f0;margin-top:4px">${esc(g.date)}</div></div><div class="pt">${num(g.scoreAgainst)}</div><div class="tm">${esc(g.opponent)}</div></div>
  <div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><div class="muted">🏟️ ${esc(g.venue || '会場未登録')}${(g.gameNo || 1) > 1 ? `・第${g.gameNo}試合` : ''}${g.start ? `・${esc(g.start)}〜${esc(g.end || '')}` : ''}</div><div class="muted">${kindTag(g)} ${esc(g.tourney || '')}</div></div>${g.memo ? `<div class="note">${esc(g.memo)}</div>` : ''}</div>
  ${line}
  ${g.mvp ? `<div class="mvp-card" data-player="${esc(g.mvp)}" style="margin-bottom:12px">${avatar(P(g.mvp), 58, true)}<div><div class="ttl">🏆 試合MVP</div><div class="nm">${pname(g.mvp)}</div></div></div>` : '<div class="card"><div class="muted">試合MVP：未登録</div></div>'}
  ${g.mvp2 ? `<div class="mvp-card" data-player="${esc(g.mvp2)}" style="margin-bottom:12px;background:linear-gradient(135deg,#fbfcfe,#dfe6ee);border-color:#c3cdd8">${avatar(P(g.mvp2), 50)}<div><div class="ttl">🥈 準MVP</div><div class="nm">${pname(g.mvp2)}</div></div></div>` : ''}
  <div class="card"><h3>💥 本塁打</h3>${hrs.length ? hrs.map(x => `<span class="badge gold" data-player="${esc(x.playerId)}">💥 ${pname(x.playerId)} ${x.HR > 1 ? x.HR + '本' : ''}</span>`).join('') : '<div class="muted">なし（または未登録）</div>'}</div>
  <div class="card"><h3>👥 出場選手（${players.length}人）</h3>${players.length ? players.map(pid => `<span class="badge" data-player="${esc(pid)}">${P(pid) ? '#' + esc(P(pid).number) + ' ' : ''}${pname(pid)}</span>`).join('') : '<div class="muted">個人成績が未登録です</div>'}</div>
  ${bat.length ? `<div class="card"><h3>🏏 打撃成績</h3><div class="tscroll"><table class="t"><tr><th class="l">選手</th><th>打席</th><th>打数</th><th>安打</th><th>本</th><th>打点</th><th>得点</th><th>盗塁</th><th>四球</th><th>三振</th></tr>
    ${bat.map(x => `<tr data-player="${esc(x.playerId)}" style="cursor:pointer"><td class="l">${pname(x.playerId)}</td><td>${num(x.PA)}</td><td>${num(x.AB)}</td><td>${num(x.H)}</td><td>${num(x.HR)}</td><td>${num(x.RBI)}</td><td>${num(x.R)}</td><td>${num(x.SB)}</td><td>${num(x.BB)}</td><td>${num(x.SO)}</td></tr>`).join('')}</table></div></div>` : ''}
  ${pit.length ? `<div class="card"><h3>⚾ 投手成績</h3><div class="tscroll"><table class="t"><tr><th class="l">投手</th><th>投球回</th><th>勝敗</th><th>奪三振</th><th>与四球</th><th>被安打</th><th>失点</th><th>自責</th></tr>

  return { title: `vs ${g.opponent}`, html, after: el => { if (g.mvp) confetti(el.querySelector('.mvp-card'), 24); } };

// --- MVP表彰
VIEWS.mvp = () => {
  const d = D(), s = SC(), sl = SL();

  const latest = gs[0];
  const months = d.rankings.mvpAwards.filter(a => a.type === 'month' && String(a.season) === S.season).sort((a, b) => b.period.localeCompare(a.period));

    : `<div class="card"><div class="muted">${ttl}：未登録</div></div>`;

    title: '🥇 MVP表彰台',

      ${latest && latest.mvp2 ? card('🥈 最新試合の準MVP', latest.mvp2, `${esc(latest.date)} vs ${esc(latest.opponent)}`) : ''}

      ${year.length ? year.map(a => card(`👑 年間MVP（${esc(a.season)}年）`, a.playerId, esc(a.memo || ''))).join('') : card(`👑 年間MVP（${esc(S.season)}年）`, null)}

// --- トロフィー
VIEWS.trophy = () => {
  const d = D();
  const tr = d.rankings.trophies.slice().sort((a, b) => String(b.season).localeCompare(String(a.season)));
  const rows = d.rankings.settings.seasons.slice().reverse().map(se => {
    const r = C.teamRecord(d, se);
    const pct = r.W + r.L > 0 ? C.fmtRate3(r.W / (r.W + r.L)) : '—';
    return `<tr><td class="l">${esc(se)}年</td><td>${r.G}</td><td>${r.W}</td><td>${r.L}</td><td>${r.D}</td><td>${pct}</td><td>${r.RF}</td><td>${r.RA}</td></tr>`;

  return {
    title: '🏅 トロフィールーム',
    html: `<div class="card"><h3>🏆 獲得タイトル</h3>${tr.length ? tr.map(t => `<div class="list-item" style="cursor:default"><span style="font-size:30px">🏆</span><div class="grow"><div class="nm">${esc(t.name)}</div><div class="muted">${esc(t.season)}年 ${esc(t.memo || '')}</div></div></div>`).join('') : '<div class="muted">トロフィーはまだ登録されていません。</div>'}</div>
      <div class="card"><h3>📊 シーズン別チーム成績</h3><div class="tscroll"><table class="t"><tr><th class="l">年</th><th>試合</th><th>勝</th><th>敗</th><th>分</th><th>勝率</th><th>得点</th><th>失点</th></tr>${rows}</table></div><div class="note">勝率＝勝÷(勝＋敗)。引き分けは含めません。</div></div>`

function sourceLabel() {
  return { json: '公開サーバーの最新データ', embedded: '埋め込みデータ（data.js）', cache: 'この端末に保存された前回のデータ', preview: '管理画面の下書き', none: 'なし' }[S.source] || S.source;
}

/* ================= シート（画面の開閉） ================= */
function openView(name, prm = {}, push = true, quiet = false) {
  const v = VIEWS[name](prm);
  if (!quiet) SFX.play(name === 'mvp' ? 'fanfare' : name === 'profile' ? 'hit' : !push ? 'nav' : 'open');
  if (push) S.stack.push({ name, prm }); else S.stack = [{ name, prm }];
  $('#sheetTitle').textContent = v.title;
  const body = $('#sheetBody'); body.innerHTML = v.html; body.scrollTop = 0;
  $('#sheet').classList.add('open'); $('#sheet').setAttribute('aria-hidden', 'false');
  $('#backBtn').classList.toggle('ghost', S.stack.length < 2);
  if (v.after) v.after(body);
  // 選択中のボタンが横スクロールの外にあれば見える位置へ
  body.querySelectorAll('.chips .chip.on').forEach(c => { const box = c.parentNode; box.scrollLeft = c.offsetLeft - box.clientWidth / 2 + c.offsetWidth / 2; });
  const navMap = { roster: 'roster', ranking: 'ranking', table: 'ranking', me: 'me', games: 'games', game: 'games', profile: S.stack[0].name === 'me' ? 'me' : null };
  const nv = navMap[S.stack[0].name] || S.stack[0].name;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.nav === nv));
  const h = name === 'profile' ? `#player=${prm.id}` : name === 'game' ? `#game=${prm.id}` : name === 'ranking' ? `#ranking=${prm.key || S.boardCat}` : `#${name}`;
  history.replaceState(null, '', location.pathname + location.search + h);
  if (World) World.setPaused(true);
}
function closeSheet() {
  if ($('#sheet').classList.contains('open')) SFX.play('close');
  $('#sheet').classList.remove('open'); $('#sheet').setAttribute('aria-hidden', 'true');
  S.stack = [];
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.nav === 'home'));
  history.replaceState(null, '', location.pathname + location.search);
  if (World) World.setPaused(false);
}
function back() {
  if (S.stack.length < 2) return closeSheet();
  S.stack.pop(); const top = S.stack.pop(); SFX.play('close'); openView(top.name, top.prm, true, true);
}
function refreshSheet() {
  if (!S.stack.length) return;
  const top = S.stack.pop(); openView(top.name, top.prm, true, true);
}

/* ================= イベント ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-zoomcard],[data-tsort],[data-kind],[data-player],[data-game],[data-rank],[data-nav],[data-go],[data-pick],[data-setmy],[data-share],[data-order],[data-spot]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.nav) { if (ds.nav === 'home') closeSheet(); else openView(ds.nav, {}, false); return; }
  if (ds.spot) { World && World.flyTo(ds.spot); document.querySelectorAll('#spots .chip').forEach(c => c.classList.toggle('on', c === t)); toast('看板や選手をタップすると詳しく見られます'); return; }
  if (ds.rank) { S.boardCat = ds.rank; World && World.setBoard(ds.rank); S.stack.pop(); openView('ranking', { key: ds.rank }, true, true); return; }
if (ds.zoomcard) { const lb = document.createElement('div'); lb.id = 'lightbox'; lb.innerHTML = `<img src="${cardOf(P(ds.zoomcard))}" alt="">`; lb.onclick = () => lb.remove(); document.body.appendChild(lb); return; }
if (ds.kind) { setScope(S.season, ds.kind); return; }
  if (ds.tsort) { const st = S.tableSort[ds.ttype]; if (st.k === ds.tsort) st.dir *= -1; else { st.k = ds.tsort; st.dir = ['ERA', 'WHIP'].includes(ds.tsort) ? 1 : -1; } refreshSheet(); return; }
  if (ds.order) { S.gamesOrder = ds.order; refreshSheet(); return; }
  if (ds.go) { openView(ds.go, ds.key ? { key: ds.key } : {}, !$('#sheet').classList.contains('open') ? false : true); return; }
  if (ds.pick) { setMy(ds.pick); openView('me', {}, false); return; }
  if (ds.setmy) { setMy(ds.setmy); refreshSheet(); toast('この端末で「自分の選手」に設定しました'); return; }
  if (ds.share) { share(); return; }
  if (ds.player) { openView('profile', { id: ds.player }, $('#sheet').classList.contains('open')); return; }
  if (ds.game) { openView('game', { id: ds.game }, $('#sheet').classList.contains('open')); return; }
});
function setMy(id) { S.my = id; try { localStorage.setItem('wr-my-player', id); } catch (e) {} if (S.mode === '2d') renderHome2D(); }
async function share() {
  const url = location.href;
  try {
    if (navigator.share) { await navigator.share({ title: 'ワイルドローバーズ', url }); return; }
    await navigator.clipboard.writeText(url); toast('URLをコピーしました。LINEに貼り付けて共有できます');
  } catch (e) { prompt('このURLをコピーしてください', url); }
}

/* ================= BGM =================
 * ・ブラウザの決まりで、最初は音を出せません。🔇ボタンを押すと流れます
 * ・サイトのフォルダに bgm.mp3 があればそれを流し、なければオリジナル曲をその場で演奏します（著作権の心配なし）
 * ・ONにした人は次回、最初に画面をタップしたときに自動で流れ始めます
 */
const BGM = (() => {
  let ctx = null, master = null, timer = null, step = 0, nextTime = 0, playing = false, audio = null, useFile = null;
  const TEMPO = 132, EIGHTH = 60 / TEMPO / 2;
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  // コード（1小節ずつ）：C → G → Am → F → C → G → F → G
  const BARS = [[48, 60, 64, 67], [43, 59, 62, 67], [45, 60, 64, 69], [41, 60, 65, 69], [48, 60, 64, 67], [43, 59, 62, 67], [41, 60, 65, 69], [43, 59, 62, 65]];
  // オリジナルのメロディ（8分音符×8×8小節、0は休み）
  const MEL = [
    72, 0, 76, 0, 79, 0, 76, 74, 74, 0, 71, 0, 67, 0, 71, 74, 72, 0, 76, 0, 81, 0, 79, 76, 77, 0, 76, 74, 72, 0, 0, 0,
    79, 0, 79, 81, 79, 0, 76, 0, 74, 0, 74, 76, 74, 0, 71, 0, 72, 74, 76, 77, 79, 0, 77, 76, 74, 0, 0, 0, 79, 0, 0, 0];
  function tone(freq, t, dur, type, vol) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.03);
  }
  let noiseBuf = null;
  function noise(t, dur, vol, freq) {
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.3, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  function kick(t) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g).connect(master); o.start(t); o.stop(t + 0.2);
  }
  function play(s, t) {
    const bar = Math.floor(s / 8), b = s % 8, ch = BARS[bar];
    tone(hz(ch[0] + (b % 2 ? 12 : 0)), t, EIGHTH * 0.9, 'triangle', 0.16);          // ベース
    if (b % 2 === 1) ch.slice(1).forEach(n => tone(hz(n), t, EIGHTH * 0.7, 'square', 0.018)); // 裏拍のオルガン
    if (MEL[s]) tone(hz(MEL[s]), t, EIGHTH * 1.7, 'square', 0.05);                   // メロディ
    if (b % 4 === 0) kick(t);
    if (b % 4 === 2) noise(t, 0.12, 0.18, 1200);                                     // スネア
    noise(t, 0.03, 0.05, 7000);                                                      // ハイハット
    if (s === 63) noise(t, 0.5, 0.08, 3000);                                         // 1周ごとのシンバル
  }
  function schedule() {
    while (nextTime < ctx.currentTime + 0.2) { play(step, nextTime); nextTime += EIGHTH; step = (step + 1) % MEL.length; }
  }
  function startSynth() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (!master) { master = ctx.createGain(); master.gain.value = 0.55; const comp = ctx.createDynamicsCompressor(); master.connect(comp).connect(ctx.destination); }
    ctx.resume(); step = 0; nextTime = ctx.currentTime + 0.05;
    clearInterval(timer); timer = setInterval(schedule, 50); schedule();
  }
  function stopSynth() { clearInterval(timer); timer = null; if (ctx) ctx.suspend(); }
  async function start() {
    playing = true;
    // iPhoneのSafariはタップした瞬間でないと音の準備ができないので、先に準備しておく
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); ctx.resume();
    if (useFile !== false) {
      audio = audio || Object.assign(new Audio('bgm.mp3'), { loop: true, volume: 0.45 });
      try { await audio.play(); useFile = true; return; } catch (e) { useFile = false; }
    }
    startSynth();
  }
  function stop() { playing = false; if (audio) audio.pause(); stopSynth(); }
  document.addEventListener('visibilitychange', () => {
    if (!playing) return;
    if (document.hidden) { if (audio && useFile) audio.pause(); if (ctx) ctx.suspend(); }
    else if (useFile) audio.play().catch(() => {}); else if (ctx) { ctx.resume(); nextTime = ctx.currentTime + 0.05; }
  });
  return { start, stop, get playing() { return playing; }, state: () => ({ file: useFile, ctx: ctx && ctx.state, step }) };
})();
/* ================= 効果音 =================
 * BGMと同じく、音声ファイルを使わずプログラムで鳴らす。初期設定はオン（「wr-se」で記憶）
 */
const SFX = (() => {
  let ctx = null, master = null;
  let on = true; try { on = localStorage.getItem('wr-se') !== '0'; } catch (e) {}
  function ready() {
    if (!on) return false;
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (!master) { master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); }
      if (ctx.state !== 'running') ctx.resume();
      return true;
    } catch (e) { return false; }
  }
  const hz = n => 440 * Math.pow(2, (n - 69) / 12);
  function tone(freq, t, dur, type, vol, slideTo) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.02);
  }
  let buf = null;
  function noise(t, dur, vol, type, f0, f1) {
    if (!buf) { buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate); const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    const src = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; fl.type = type; fl.Q.value = 1.2; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(fl).connect(g).connect(master); src.start(t); src.stop(t + dur + 0.02);
  }
  const play = {
    pop() { const t = ctx.currentTime; tone(900, t, 0.07, 'sine', 0.25, 1500); },                       // ボタン「ポンッ」
    nav() { const t = ctx.currentTime; tone(hz(84), t, 0.06, 'square', 0.06); tone(hz(91), t + 0.06, 0.08, 'square', 0.06); }, // 「ピロッ」
    open() { const t = ctx.currentTime; noise(t, 0.22, 0.18, 'bandpass', 500, 3500); },                  // 「シュッ」（開く）
    close() { const t = ctx.currentTime; noise(t, 0.2, 0.15, 'bandpass', 3000, 400); },                  // 「シュッ」（閉じる）
    hit() {                                                                                              // 「カキーン！」
      const t = ctx.currentTime;
      noise(t, 0.05, 0.5, 'highpass', 2500);
      [1780, 2620, 3950].forEach((f, i) => tone(f, t, 0.5 - i * 0.1, 'sine', 0.16 - i * 0.04));
      tone(220, t, 0.08, 'triangle', 0.25, 110);
    },
    fanfare() {                                                                                          // MVPのファンファーレ＋歓声
      const t = ctx.currentTime;
      [[72, 0], [76, 0.11], [79, 0.22], [84, 0.33]].forEach(([n, d]) => tone(hz(n), t + d, d === 0.33 ? 0.6 : 0.13, 'square', 0.08));
      [72, 76, 79].forEach(n => tone(hz(n - 12), t + 0.33, 0.6, 'triangle', 0.08));
      noise(t + 0.3, 1.4, 0.12, 'bandpass', 1200, 900);
    },
    tick() { const t = ctx.currentTime; tone(1800, t, 0.03, 'square', 0.04); }                           // 切り替え「カチッ」
  };
  return {
    play(name) { const L = (window.__sfxLog = window.__sfxLog || []); L.push(name); if (L.length > 30) L.shift(); if (ready() && play[name]) try { play[name](); } catch (e) {} },
    get on() { return on; },
    set(v) { on = v; try { localStorage.setItem('wr-se', v ? '1' : '0'); } catch (e) {} }
  };
})();

// 右上の音ボタン：押すと「BGM」「効果音」を切り替えるメニュー
function setBgmButton() {
  const b = $('#bgmBtn');
  b.textContent = BGM.playing ? '🔊' : SFX.on ? '🔈' : '🔇';
  b.classList.toggle('on', BGM.playing);
  const m = $('#soundMenu');
  if (m) m.innerHTML = `<button data-snd="bgm">🎵 BGM<b class="${BGM.playing ? 'on' : ''}">${BGM.playing ? 'ON' : 'OFF'}</b></button><button data-snd="se">🔔 効果音<b class="${SFX.on ? 'on' : ''}">${SFX.on ? 'ON' : 'OFF'}</b></button>`;
}
$('#bgmBtn').onclick = e => {
  e.stopPropagation();
  let m = $('#soundMenu');
  if (m) { m.remove(); return; }
  m = document.createElement('div'); m.id = 'soundMenu'; document.body.appendChild(m); setBgmButton();
  m.onclick = async ev => {
    ev.stopPropagation();
    const k = ev.target.closest('[data-snd]'); if (!k) return;
    if (k.dataset.snd === 'bgm') {
      if (BGM.playing) { BGM.stop(); try { localStorage.setItem('wr-bgm', '0'); } catch (er) {} }
      else { await BGM.start(); try { localStorage.setItem('wr-bgm', '1'); } catch (er) {} }
    } else { SFX.set(!SFX.on); SFX.play('pop'); }
    setBgmButton();
  };
};
document.addEventListener('click', e => { const m = $('#soundMenu'); if (m && !e.target.closest('#soundMenu')) m.remove(); });
// ボタンなどを押したときの効果音（画面が開く操作は openView 側で鳴らす）
document.addEventListener('click', e => {
  const t = e.target.closest('button, .chip, [data-zoomcard], [data-tsort], summary');
  if (!t || t.closest('#soundMenu') || ['bgmBtn', 'backBtn', 'closeBtn'].includes(t.id)) return;
  if (t.closest('[data-player],[data-game],[data-go],[data-pick],[data-nav]')) return;
  if (t.matches('[data-rank],[data-kind],[data-order],[data-tsort]')) SFX.play('tick'); else SFX.play('pop');
}, true);
setBgmButton();
// 前回ONにしていた人は、最初に画面をタップしたときに流す（ブラウザの決まりで、タップ前には鳴らせない）
try {
  if (localStorage.getItem('wr-bgm') === '1') {
    const kick = async e => { if (e.target.closest('#bgmBtn')) return; document.removeEventListener('pointerdown', kick, true); if (!BGM.playing) { await BGM.start(); setBgmButton(); } };
    document.addEventListener('pointerdown', kick, true);
  }
} catch (e) {}

/* ================= 3D / 2D 切り替え ================= */
let World = null;
function webglOK() { try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); } catch (e) { return false; } }
async function setMode(mode, user) {
  if (mode === '3d' && !webglOK()) { toast('この端末は3D表示に対応していないため2D表示にします'); mode = '2d'; }
  if (mode === '3d' && !World) {
    try { World = await createWorld(); }
    catch (e) { console.error(e); toast('3Dを読み込めなかったため軽量2D表示にしました'); mode = '2d'; }
  }
  S.mode = mode;
  try { if (user) localStorage.setItem('wr-mode', mode); } catch (e) {}
  const is3d = mode === '3d';
  $('#stage').classList.toggle('hidden', !is3d); $('#hud').classList.toggle('hidden', !is3d); $('#spots').classList.toggle('hidden', !is3d);
  $('#tapHint').classList.toggle('hidden', !is3d);
  $('#home2d').classList.toggle('hidden', is3d);
  $('#modeBtn').textContent = is3d ? '2D表示' : '3D表示';
  if (World) World.setActive(is3d);
  if (!is3d) renderHome2D();
  updateEmptyCard();
}
function updateEmptyCard() {
  const el = $('#emptyCard');
  const show = S.mode === '3d' && !D().players.players.length;
  el.classList.toggle('hidden', !show);
  if (show) el.innerHTML = `<div style="font-size:36px">🏟️</div><b>まだ選手が登録されていません</b><p>代表者が管理画面（admin.html）で選手と試合を登録すると、グラウンドに選手が登場します。</p>${!TEST ? '<a class="btn y" href="?test=1">🧪 テストデータで試す</a>' : ''}`;
}

/* =========================================================
 *  3Dワールド（three.js）
 * ========================================================= */
async function createWorld() {
  const THREE = await import('three');
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');

  const lowEnd = (navigator.hardwareConcurrency || 4) <= 4 || (navigator.deviceMemory || 4) <= 3;
  const stage = $('#stage');
  const renderer = new THREE.WebGLRenderer({ antialias: !lowEnd && devicePixelRatio < 2, powerPreference: 'low-power' });
  renderer.setPixelRatio(Math.min(devicePixelRatio, lowEnd ? 1.25 : 1.75));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#9fd8ff');
  scene.fog = new THREE.Fog('#bfe6ff', 120, 220);
  const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 400);
  const HOME_VIEW = { target: new THREE.Vector3(0, 0, -16), pos: new THREE.Vector3(0, 46, 52) };
  camera.position.copy(HOME_VIEW.pos);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME_VIEW.target);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.enablePan = false;
  controls.minDistance = 10; controls.maxDistance = 120;
  controls.maxPolarAngle = 1.38; controls.minPolarAngle = 0.25;
  controls.autoRotate = true; controls.autoRotateSpeed = 0.45;
  controls.rotateSpeed = 0.6;

  scene.add(new THREE.HemisphereLight('#e8f6ff', '#4a8c3a', 1.4));
  const sun = new THREE.DirectionalLight('#fff4dc', 1.6); sun.position.set(30, 60, 20); scene.add(sun);

  // トゥーン調の陰影（3段階）
  const grad = new THREE.DataTexture(new Uint8Array([90, 170, 255]), 3, 1, THREE.RedFormat);
  grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
  const toon = (c, extra = {}) => new THREE.MeshToonMaterial(Object.assign({ color: c, gradientMap: grad }, extra));
  const M = {
    navy: toon('#1a2f73'), yellow: toon('#ffc928'), white: toon('#f6f7fb'), skin: toon('#ffd3ad'),
    dirt: toon('#d9a066'), dirtDark: toon('#c58a52'), grass: null, black: new THREE.MeshBasicMaterial({ color: '#1d1d2b' }),
    pink: new THREE.MeshBasicMaterial({ color: '#ff9e8f', transparent: true, opacity: .6 }), brown: toon('#8b5a2b'),
    grey: toon('#9aa6b8'), gold: new THREE.MeshPhongMaterial({ color: '#f5c542', shininess: 90, specular: '#fff3c0', emissive: '#4a3500' }),
    silver: new THREE.MeshPhongMaterial({ color: '#cfd8e3', shininess: 90 }), bronze: new THREE.MeshPhongMaterial({ color: '#d9935a', shininess: 70 }),
    shadow: new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: .18, depthWrite: false }),
    hit: new THREE.MeshBasicMaterial({ visible: false })
  };
  const clickables = [];
  const tex = (canvas) => { const t = new THREE.CanvasTexture(canvas); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; };
  const FONT = `"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif`;
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function fitText(ctx, text, maxW, size, weight = 800) {
    let s = size; do { ctx.font = `${weight} ${s}px ${FONT}`; s -= 2; } while (ctx.measureText(text).width > maxW && s > 10);
  }

  /* ----- チームロゴ（紺の背景を透明に切り抜いて使う） ----- */
  const logoImg = new Image();
  const logoReady = new Promise(res => { logoImg.onload = res; logoImg.onerror = res; });
  logoImg.src = window.WR_LOGO_DATA || 'logo-512.jpg';
  let logoCut = null;
  function logoCutout() {
    if (logoCut) return logoCut;
    if (!logoImg.naturalWidth) return null;
    const N = 512, [c, ctx] = mkCanvas(N, N);
    ctx.drawImage(logoImg, 0, 0, N, N);
    let img; try { img = ctx.getImageData(0, 0, N, N); } catch (e) { return (logoCut = c); }
    const px = img.data, bg = [px[0], px[1], px[2]], seen = new Uint8Array(N * N);
    const near = i => Math.abs(px[i * 4] - bg[0]) + Math.abs(px[i * 4 + 1] - bg[1]) + Math.abs(px[i * 4 + 2] - bg[2]) < 70;
    const stack = [0, N - 1, N * (N - 1), N * N - 1];
    while (stack.length) { // 四隅から背景色の部分だけを塗りつぶして透明にする
      const i = stack.pop(); if (seen[i]) continue; seen[i] = 1;

      const x = i % N, y = (i / N) | 0;
      if (x > 0) stack.push(i - 1); if (x < N - 1) stack.push(i + 1); if (y > 0) stack.push(i - N); if (y < N - 1) stack.push(i + N);

    flat(new THREE.ShapeGeometry(sh, 24), M.dirt, 0.02);
    const g2 = new THREE.Shape(); g2.moveTo(0, 2.3); g2.lineTo(10.4, 12.73); g2.lineTo(0, 23.1); g2.lineTo(-10.4, 12.73); g2.closePath();

  }
  { // ベース・マウンド・ファウルライン
